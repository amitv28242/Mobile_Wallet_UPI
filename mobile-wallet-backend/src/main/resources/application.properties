# ---------- Application ----------

spring.application.name=mobile-wallet-backend
server.port=9090
server.servlet.context-path=/api

spring.main.allow-bean-definition-overriding=true

# ---------- Database ----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/mobile_wallet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:8520}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true

# ---------- Connection Pool ----------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# ---------- JWT ----------
# Secret must be at least 32 characters (256 bits) for HS256
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyChangeInProduction1234567890}
# Access token expires in 900 seconds (15 minutes)
app.jwt.access-token-expiration=900
# Refresh token expires in 604800 seconds (7 days)
app.jwt.refresh-token-expiration=604800

# ---------- AES Encryption ----------
# Must be exactly 16 chars for AES-128
app.aes.secret=${AES_SECRET:defaultAESKey16c}

# ---------- OTP ----------
app.otp.length=6
app.otp.expiration-seconds=300
app.otp.max-attempts=3
app.otp.resend-cooldown-seconds=60
app.otp.dev-mode-enabled=${DEV_OTP_ENABLED:true}
app.otp.dev-otp-value=123456

# ---------- QR ----------
app.qr.expiration-seconds=300
app.qr.max-token-length=100

# ---------- Firebase ----------
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.config-path=${FIREBASE_CONFIG_PATH:firebase/service-account.json}

# ---------- Logging ----------
logging.level.com.mobilewallet=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ---------- Springdoc / OpenAPI ----------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# ---------- Server Error Handling ----------
server.error.include-stacktrace=never
server.error.include-exception=false