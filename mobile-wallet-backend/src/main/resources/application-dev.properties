
# Development Profile

spring.datasource.url=jdbc:mysql://localhost:3306/mobile_wallet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.mobilewallet=DEBUG
logging.level.org.springframework.security=DEBUG

app.otp.dev-mode-enabled=true

# Actuator
management.endpoints.web.exposure.include=*