// FILE: consumer-app/app/build.gradle
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.mobilewallet.consumer'
    compileSdk 35

    defaultConfig {
        applicationId "com.mobilewallet.consumer"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // API Base URLs
        buildConfigField "String", "BASE_URL_DEBUG", "\"http://10.0.2.2:9090/api/\""
        buildConfigField "String", "BASE_URL_RELEASE", "\"https://api.mobilewallet.com/api/\""
        buildConfigField "String",  "APP_NAME",           "\"Mobile Wallet\""
        buildConfigField "String",  "APP_VERSION",        "\"1.0.0\""
        buildConfigField "String",  "API_VERSION",        "\"v1\""
        buildConfigField "int",     "API_TIMEOUT_SECONDS", "30"
        buildConfigField "int",     "PAGE_SIZE",           "20"
        buildConfigField "int",     "QR_EXPIRY_SECONDS",   "300"
        buildConfigField "boolean", "LOG_NETWORK",         "true"
    }

    buildTypes {
        debug {
            // ============ DEBUG BUILD ============
            // Local development (Android Emulator → host machine)

            buildConfigField "String", "BASE_URL", "\"http://10.0.2.2:9090/api/\""
            buildConfigField "String",  "WS_URL",         "\"ws://10.0.2.2:9090/ws/\""
            buildConfigField "String",  "ENVIRONMENT",    "\"development\""
            buildConfigField "boolean", "ENABLE_LOGGING", "true"
            buildConfigField "boolean", "ENABLE_MOCK",    "false"

            minifyEnabled false
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // ============ RELEASE BUILD ============

            buildConfigField "String",  "BASE_URL",       "\"https://api.mobilewallet.com/api/\""
            buildConfigField "String",  "WS_URL",         "\"wss://api.mobilewallet.com/ws/\""
            buildConfigField "String",  "ENVIRONMENT",    "\"production\""
            buildConfigField "boolean", "ENABLE_LOGGING", "false"
            buildConfigField "boolean", "ENABLE_MOCK",    "false"

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // ============ STAGING BUILD (optional) ============
        staging {
            initWith debug
            buildConfigField "String",  "BASE_URL",       "\"https://staging-api.mobilewallet.com/api/\""
            buildConfigField "String",  "WS_URL",         "\"wss://staging-api.mobilewallet.com/ws/\""
            buildConfigField "String",  "ENVIRONMENT",    "\"staging\""
            buildConfigField "boolean", "ENABLE_LOGGING", "true"

            minifyEnabled false
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Material Design 3
    implementation 'com.google.android.material:material:1.12.0'

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'

    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.7'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Retrofit & Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // QR Code
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // CameraX
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Security
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Lottie
    implementation 'com.airbnb.android:lottie:6.6.2'

    // Shimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}